[project]
name = "folder-organizer"
version = "0.1.1"
description = "폴더 정리 자동화 프로그램"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
folder-organizer = "organizer:cli"
